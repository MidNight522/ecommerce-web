<p-toast />
@if (navigating()) {
  <div class="route-loader" role="status" aria-label="Loading page"></div>
}
<app-base-header>
  <button
    class="header-icon"
    type="button"
    aria-label="Dark mode"
    (click)="toggleTheme()"
    [attr.aria-pressed]="isDark"
  >
    <i class="pi pi-moon" aria-hidden="true"> </i>
  </button>
</app-base-header>
<div class="page-content">
  <router-outlet />
</div>

<app-base-footer />
